<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Grabber Options</title>
  <style>
    :root {
      --bg: #0f0f13;
      --panel: #1a1a24;
      --border: #2e2e3e;
      --text: #e4e4ef;
      --muted: #8b8bab;
      --primary: #6366f1;
      --primary-h: #818cf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(99, 102, 241, 0.16), transparent 35%),
        linear-gradient(180deg, #11111a, var(--bg));
      color: var(--text);
      padding: 32px 18px;
    }

    .shell {
      max-width: 680px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      display: grid;
      gap: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .setting {
      display: grid;
      gap: 8px;
    }

    .setting-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
    }

    label {
      font-weight: 600;
    }

    .value {
      color: var(--primary-h);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--primary);
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-h);
    }

    #status {
      min-height: 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div>
        <h1>SVG Grabber Options</h1>
        <p>These settings apply to every new editing session in the side panel.</p>
      </div>

      <div class="setting">
        <div class="setting-head">
          <label for="sl-undo-steps">Undo History</label>
          <span class="value" id="sl-undo-steps-val">10</span>
        </div>
        <input type="range" id="sl-undo-steps" min="1" max="50" step="1" value="10" />
        <p>Choose how many edit states SVG Grabber keeps while you remove paths or recolor shapes.</p>
      </div>

      <div class="footer">
        <button id="btn-save">Save</button>
        <div id="status"></div>
      </div>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
